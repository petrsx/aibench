# Shapes the release page's auto-generated notes ("Generate release notes").
# Categories key on PR labels; unlabeled PRs fall through to Other Changes.
changelog:
  exclude:
    labels:
      - skip-changelog
    authors:
      - dependabot
  categories:
    - title: New Features
      labels:
        - feature
        - enhancement
    - title: Bug fixes
      labels:
        - fix
        - bug
    - title: Other Changes
      labels:
        - "*"
