name: release

# Publishing a GitHub release (the release page, with its notes) is the one
# trigger — a bare tag push deliberately does nothing. Drafts fire on publish.
on:
  release:
    types: [published]

# goreleaser runs on an app installation token, not the workflow token.
permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      # Short-lived installation token for the release app (Contents: R/W,
      # installed on exactly these repos) — the workflow token can't push to
      # petrsx/homebrew-tap or the petrsx/winget-pkgs fork.
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: petrsx
          repositories: |
            aibench
            homebrew-tap
            winget-pkgs
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
